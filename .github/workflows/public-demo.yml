name: Public examples

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 tools/verify_demo.py
      - run: python -X utf8 tools/check_publication.py
      - run: python -X utf8 tools/score_real_drawings.py
      - run: python -X utf8 tools/score_round2.py
      - run: python -X utf8 tools/score_round3.py
      - run: git diff --exit-code
